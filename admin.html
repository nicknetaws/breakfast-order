<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>早餐訂單管理</title><style>body{font-family:system-ui,'Noto Sans TC',sans-serif;background:#f3f7f2;color:#263b31;margin:0}.wrap{max-width:1050px;margin:auto;padding:20px}header{background:#267651;color:white;border-radius:15px;padding:20px}h1{margin:0}.card{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #0001}label{display:block;margin:10px 0 5px}input,select,button{font:inherit;padding:10px;border:1px solid #c7d8ce;border-radius:8px}input{width:100%;box-sizing:border-box}.filters{display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:end}.filters select{width:100%}@media(max-width:600px){.filters{grid-template-columns:1fr}}.detail{white-space:normal;min-width:190px}.empty{text-align:center;color:#63736b}button{background:#267651;color:white;cursor:pointer;margin:8px 6px 8px 0}button:disabled{opacity:.5}.muted{color:#63736b}.error{color:#aa3025;white-space:pre-wrap}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:#eaf4ed;border-radius:10px;padding:16px}.stat strong{font-size:1.4rem}table{border-collapse:collapse;width:100%;min-width:650px}th,td{border-bottom:1px solid #dce7df;padding:9px;text-align:left}th{background:#edf5ef}.scroll{overflow-x:auto}.hidden{display:none}.right{text-align:right}small{color:#63736b}</style></head><body><main class="wrap"><header><h1>⛺ 早餐訂單管理</h1><div>僅供小幫手登入查看，訂餐者請使用原本的點餐頁面</div></header><section class="card" id="loginBox"><h2>管理員登入</h2><label>電子郵件</label><input id="email" type="email" autocomplete="username"><label>密碼</label><input id="password" type="password" autocomplete="current-password"><button id="login">登入</button><p class="muted">須先在 Supabase 建立管理員帳號，並執行管理員讀取權限 SQL。</p></section><section class="card hidden" id="dashboard"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center"><h2>訂單統計</h2><button id="logout">登出</button></div><div class="filters"><div><label for="search">搜尋姓名、帳篷、電話或品項</label><input id="search" type="search" placeholder="例如：王小明、A01、0912..."></div><div><label for="date">取餐日期</label><select id="date"><option value="all">全部日期</option><option value="2026-10-25">2026/10/25</option><option value="2026-10-26">2026/10/26</option></select></div></div><button id="refresh">重新整理</button><button id="export">匯出訂單 CSV</button><button id="exportSummary">匯出備料 CSV</button><p class="muted" id="matchCount"></p><div class="stats"><div class="stat">訂單數<br><strong id="orderCount">0</strong></div><div class="stat">餐點／飲料總份數<br><strong id="unitCount">0</strong></div><div class="stat">訂單總金額<br><strong id="amount">$0</strong></div></div><h3>每日備料統計</h3><div class="scroll"><table><thead><tr><th>品項</th><th>10/25</th><th>10/26</th><th>合計</th></tr></thead><tbody id="summary"></tbody></table></div><h3>訂單明細</h3><div class="scroll"><table><thead><tr><th>建立時間</th><th>取餐日期</th><th>姓名</th><th>帳篷</th><th>電話</th><th>品項</th><th>金額</th><th>備註</th></tr></thead><tbody id="orders"></tbody></table></div><p class="muted">統計不包含已取消訂單；CSV 包含個人資料，請妥善保管。</p></section><p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
'use strict';const SUPABASE_URL='https://cffzosqyyfmzyhpcqkvp.supabase.co';const SUPABASE_KEY='sb_publishable_agzradDkZ1L2Badzr2ancQ_miayxkid';const $=id=>document.getElementById(id);const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const names=['卡拉雞腿排堡','香煎嫩雞堡','起司牛肉堡','紅茶','奶茶','豆漿','鮮奶茶'];let allOrders=[];let loggedIn=false;
function showMessage(msg,isError=false){$('message').textContent=msg;$('message').className=isError?'error':'muted'}function td(row,value){const cell=document.createElement('td');cell.textContent=String(value??'');row.appendChild(cell)}function visible(){const q=$('search').value.trim().toLocaleLowerCase();return allOrders.filter(o=>o.status!=='cancelled'&&($('date').value==='all'||o.pickup_date===$('date').value)&&(!q||[o.customer_name,o.camp_code,o.phone,o.note,...(Array.isArray(o.items)?o.items.map(i=>i.name):[])].some(v=>String(v??'').toLocaleLowerCase().includes(q))))}function render(){const list=visible(),totals={};for(const n of names)totals[n]={'2026-10-25':0,'2026-10-26':0};let units=0,amount=0;for(const o of list){amount+=Number(o.total_amount)||0;for(const item of Array.isArray(o.items)?o.items:[]){const qty=Number(item.qty)||0;if(totals[item.name]&&Object.hasOwn(totals[item.name],o.pickup_date)){totals[item.name][o.pickup_date]+=qty;units+=qty}}}$('matchCount').textContent=`符合條件 ${list.length} 筆／已載入 ${allOrders.length} 筆`;$('orderCount').textContent=list.length;$('unitCount').textContent=units;$('amount').textContent='$'+amount.toLocaleString('zh-TW');$('summary').replaceChildren();for(const n of names){const r=document.createElement('tr');const a=totals[n]['2026-10-25'],b=totals[n]['2026-10-26'];[n,a,b,a+b].forEach(v=>td(r,v));$('summary').appendChild(r)}$('orders').replaceChildren();if(!list.length){const r=document.createElement('tr');const c=document.createElement('td');c.colSpan=8;c.className='empty';c.textContent='沒有符合條件的訂單';r.appendChild(c);$('orders').appendChild(r)}for(const o of list){const r=document.createElement('tr');[new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}),o.pickup_date,o.customer_name,o.camp_code,o.phone,(Array.isArray(o.items)?o.items:[]).map(i=>`${i.name} × ${i.qty}`).join('、'),o.total_amount,o.note].forEach(v=>td(r,v));$('orders').appendChild(r)}}
async function refresh(){showMessage('正在讀取訂單…');let rows=[],from=0;const pageSize=1000;while(true){const {data,error}=await client.from('breakfast_orders').select('id,created_at,customer_name,camp_code,phone,pickup_date,items,total_amount,note,status').order('created_at',{ascending:false}).range(from,from+pageSize-1);if(error){showMessage('讀取失敗：'+error.message,true);return}rows.push(...data);if(data.length<pageSize)break;from+=pageSize;if(from>=10000){showMessage('訂單超過 10000 筆，請改用分頁匯出。',true);break}}allOrders=rows;render();showMessage(`已讀取 ${rows.length} 筆訂單`)}
async function checkSession(){const {data:{session}}=await client.auth.getSession();loggedIn=!!session;$('loginBox').classList.toggle('hidden',loggedIn);$('dashboard').classList.toggle('hidden',!loggedIn);if(loggedIn)await refresh()}
$('login').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;showMessage('登入中…');const {error}=await client.auth.signInWithPassword({email,password});if(error){showMessage('登入失敗：'+error.message,true);return}$('password').value='';await checkSession()};$('logout').onclick=async()=>{await client.auth.signOut();allOrders=[];showMessage('已登出');await checkSession()};$('refresh').onclick=refresh;$('date').onchange=render;$('search').oninput=render;
function csvValue(v){const text=String(v??'');const safe=/^[=+@\-\t\r]/.test(text)?"'"+text:text;return '"'+safe.replaceAll('"','""')+'"'}function downloadCSV(rows,filename){const csv='\ufeff'+rows.map(r=>r.map(csvValue).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('export').onclick=()=>{const rows=[['建立時間','取餐日期','姓名','帳篷','電話','品項','金額','備註'],...visible().map(o=>[o.created_at,o.pickup_date,o.customer_name,o.camp_code,o.phone,(o.items||[]).map(i=>`${i.name} x ${i.qty}`).join('; '),o.total_amount,o.note])];downloadCSV(rows,'早餐訂單_'+$('date').value+'.csv')};$('exportSummary').onclick=()=>{const list=visible();const rows=[['品項','2026/10/25','2026/10/26','合計']];for(const n of names){let a=0,b=0;for(const o of list){for(const item of Array.isArray(o.items)?o.items:[]){if(item.name!==n)continue;if(o.pickup_date==='2026-10-25')a+=Number(item.qty)||0;if(o.pickup_date==='2026-10-26')b+=Number(item.qty)||0}}rows.push([n,a,b,a+b])}downloadCSV(rows,'早餐備料_'+$('date').value+'.csv')};checkSession();
</script></body></html>
