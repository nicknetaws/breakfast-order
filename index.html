<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>營區早餐點餐</title><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#263b31;background:#f3f7f2}*{box-sizing:border-box}body{margin:0}.wrap{max-width:740px;margin:auto;padding:16px 14px 70px}header{background:#267651;color:white;padding:24px;border-radius:18px}h1{margin:0 0 10px}h2{font-size:1.15rem;margin:0 0 14px}.card{background:#fff;border-radius:16px;padding:20px;margin-top:16px;box-shadow:0 3px 16px #163e2710}label{display:block;font-weight:650;margin:12px 0 6px}input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid #cad7cf;border-radius:9px;background:white}textarea{min-height:65px}.muted{color:#63736b;font-size:.9rem}.notice{background:#fff5dd;color:#76501b;padding:12px;border-radius:10px}.total{font-size:1.7rem;color:#187046;font-weight:800}.primary{background:#24754f;color:white;font:inherit;font-weight:700;border:0;border-radius:10px;padding:14px;width:100%;cursor:pointer;margin-top:12px}.primary:disabled{opacity:.5}.secondary{background:#e7f2ea;color:#205c3d}.status{margin-top:14px;white-space:pre-wrap}.success{color:#16723c;font-weight:700}.error{color:#aa3025;font-weight:700}.item{border-bottom:1px solid #e4eae5;padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.item b{color:#267651}.counter{display:flex;align-items:center;gap:10px}.counter button{font:inherit;font-size:1.3rem;width:39px;height:39px;border:1px solid #bdd5c5;border-radius:9px;background:#e8f3eb;color:#1b6741;cursor:pointer}.counter output{min-width:23px;text-align:center;font-weight:700}.line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e9eee9}@media(max-width:450px){.card{padding:16px}}
</style></head><body><main class="wrap"><header><h1>⛺ 營區早餐團購</h1><div>2026/10/25（日）、10/26（一）｜早上 8 點前送達</div><p>取餐地點：小幫手帳篷門口（待公告）</p></header>
<section class="card"><h2>① 訂購人資訊</h2><label for="camp">帳篷／團露編號 *</label><input id="camp" maxlength="30" placeholder="例如 A03"><label for="name">訂購姓名 *</label><input id="name" maxlength="50" placeholder="請填姓名"><label for="phone">聯絡電話 *</label><input id="phone" type="tel" inputmode="tel" maxlength="10" placeholder="09xxxxxxxx"><label for="date">取餐日期 *</label><select id="date"><option value="2026-10-25">2026/10/25（日）</option><option value="2026-10-26">2026/10/26（一）</option></select><p class="muted">兩天都需要早餐，請分別提交兩張訂單。</p></section>
<section class="card"><h2>② 選擇早餐與飲料</h2><p class="muted">每種品項都可以獨立調整數量；每種最多 20 份，每張訂單最多 50 份。</p><div class="item"><span>卡拉雞腿排堡 <b>$85</b></span><div class="counter"><button type="button" data-change="-1" data-item="0" aria-label="減少卡拉雞腿排堡">−</button><output id="q0">0</output><button type="button" data-change="1" data-item="0" aria-label="增加卡拉雞腿排堡">＋</button></div></div><div class="item"><span>香煎嫩雞堡 <b>$80</b></span><div class="counter"><button type="button" data-change="-1" data-item="1" aria-label="減少香煎嫩雞堡">−</button><output id="q1">0</output><button type="button" data-change="1" data-item="1" aria-label="增加香煎嫩雞堡">＋</button></div></div><div class="item"><span>起司牛肉堡 <b>$95</b></span><div class="counter"><button type="button" data-change="-1" data-item="2" aria-label="減少起司牛肉堡">−</button><output id="q2">0</output><button type="button" data-change="1" data-item="2" aria-label="增加起司牛肉堡">＋</button></div></div><div class="item"><span>紅茶 <b>$25</b></span><div class="counter"><button type="button" data-change="-1" data-item="3" aria-label="減少紅茶">−</button><output id="q3">0</output><button type="button" data-change="1" data-item="3" aria-label="增加紅茶">＋</button></div></div><div class="item"><span>奶茶 <b>$25</b></span><div class="counter"><button type="button" data-change="-1" data-item="4" aria-label="減少奶茶">−</button><output id="q4">0</output><button type="button" data-change="1" data-item="4" aria-label="增加奶茶">＋</button></div></div><div class="item"><span>豆漿 <b>$30</b></span><div class="counter"><button type="button" data-change="-1" data-item="5" aria-label="減少豆漿">−</button><output id="q5">0</output><button type="button" data-change="1" data-item="5" aria-label="增加豆漿">＋</button></div></div><div class="item"><span>鮮奶茶 <b>$40</b></span><div class="counter"><button type="button" data-change="-1" data-item="6" aria-label="減少鮮奶茶">−</button><output id="q6">0</output><button type="button" data-change="1" data-item="6" aria-label="增加鮮奶茶">＋</button></div></div><label for="notes">備註</label><textarea id="notes" maxlength="300" placeholder="特殊需求請向小幫手確認"></textarea></section>
<section class="card"><h2>③ 確認訂單</h2><div id="details">尚未選擇品項</div><p>總金額：<span class="total" id="total">$0</span></p><div class="notice">測試版：請先在 Supabase 執行新版 SQL，測試成功後再開放收單。公開端點仍可能遭到大量提交。</div><button id="submit" class="primary">確認並提交整張訂單</button><button id="copy" class="primary secondary">複製訂單摘要</button><p id="message" class="status" role="status" aria-live="polite"></p></section></main>
<script>
'use strict';
const URL='https://cffzosqyyfmzyhpcqkvp.supabase.co';
const KEY='sb_publishable_agzradDkZ1L2Badzr2ancQ_miayxkid';
const menu=[{"name": "卡拉雞腿排堡", "price": 85, "kind": "food"}, {"name": "香煎嫩雞堡", "price": 80, "kind": "food"}, {"name": "起司牛肉堡", "price": 95, "kind": "food"}, {"name": "紅茶", "price": 25, "kind": "drink"}, {"name": "奶茶", "price": 25, "kind": "drink"}, {"name": "豆漿", "price": 30, "kind": "drink"}, {"name": "鮮奶茶", "price": 40, "kind": "drink"}];
const quantities=menu.map(()=>0);const $=id=>document.getElementById(id);let sending=false;
function cart(){const items=menu.flatMap((m,i)=>quantities[i]>0?[{name:m.name,qty:quantities[i]}]:[]);const total=menu.reduce((sum,m,i)=>sum+m.price*quantities[i],0);const count=quantities.reduce((a,b)=>a+b,0);return {items,total,count};}
function render(){const c=cart();quantities.forEach((n,i)=>$('q'+i).textContent=n);$('details').innerHTML=c.items.length?c.items.map(x=>{const m=menu.find(y=>y.name===x.name);return `<div class="line"><span>${x.name} × ${x.qty}</span><strong>$${x.qty*m.price}</strong></div>`}).join(''):'尚未選擇品項';$('total').textContent='$'+c.total;}
document.querySelectorAll('[data-change]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.item),d=Number(b.dataset.change);quantities[i]=Math.max(0,Math.min(20,quantities[i]+d));render();}));
function summary(){const c=cart();return `日期：${$('date').value}\n帳篷：${$('camp').value.trim()}\n姓名：${$('name').value.trim()}\n電話：${$('phone').value.trim()}\n${c.items.map(x=>`${x.name} × ${x.qty}`).join('\n')}\n總數：${c.count}\n合計：$${c.total}\n備註：${$('notes').value.trim()}`;}
function validate(){const c=cart();if(!$('camp').value.trim()||!$('name').value.trim())throw Error('請填寫帳篷編號與姓名');if(!/^09\d{8}$/.test($('phone').value.trim()))throw Error('請填寫有效的台灣手機號碼');if(!['2026-10-25','2026-10-26'].includes($('date').value))throw Error('取餐日期不正確');if(c.count<1||c.count>50)throw Error('請至少選一份，整張訂單最多 50 份');return c;}
async function submit(){if(sending)return;let c;try{c=validate()}catch(e){$('message').className='status error';$('message').textContent=e.message;return}const text=summary();if(!confirm('確定提交以下訂單？\n\n'+text))return;sending=true;$('submit').disabled=true;$('message').className='status';$('message').textContent='提交中，請勿重複按下…';const payload={customer_name:$('name').value.trim(),camp_code:$('camp').value.trim(),phone:$('phone').value.trim(),pickup_date:$('date').value,items:c.items,total_amount:c.total,note:$('notes').value.trim()};try{const r=await fetch(URL+'/rest/v1/breakfast_orders',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)});if(!r.ok){const raw=await r.text();let detail=raw;try{const obj=JSON.parse(raw);detail=obj.message||obj.code||raw}catch{}throw Error('HTTP '+r.status+'：'+detail)}$('message').className='status success';$('message').textContent='訂單已提交至資料庫！請保存以下摘要：\n'+text+'\n如需確認，請向小幫手提供姓名、帳篷與日期。';quantities.fill(0);render();}catch(e){$('message').className='status error';$('message').textContent='無法確認提交成功：'+e.message+'。請先向小幫手查詢，避免重複下單。';}finally{sending=false;$('submit').disabled=false;}}
$('submit').addEventListener('click',submit);$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(summary());$('message').textContent='摘要已複製'}catch{$('message').textContent='無法自動複製'}});render();
</script></body></html>
