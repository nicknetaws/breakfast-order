<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⛺ 營區早餐團購點餐</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#24332c;background:#f4f7f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:22px 14px 80px}header{background:#267653;color:white;padding:26px;border-radius:20px}h1{margin:0 0 10px}h2{font-size:1.18rem;margin:0 0 16px}.card{background:white;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 4px 20px #2342}label{display:block;font-weight:600;margin:12px 0 6px}input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #cbd7cf;border-radius:10px;background:white}textarea{min-height:65px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.product{border:1px solid #dce6df;border-radius:13px;padding:15px}.product b{display:block;min-height:42px}.price{color:#267653;font-weight:bold}.qty{display:flex;align-items:center;gap:8px;margin-top:10px}.qty button{width:36px;height:36px;border:0;border-radius:9px;background:#e4f1e8;font-size:21px;cursor:pointer}.qty span{min-width:25px;text-align:center}.primary{background:#267653;color:white;border:0;border-radius:12px;padding:15px 20px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:14px}.secondary{background:#e7f0e9;color:#23583e}.total{font-size:1.5rem;font-weight:800;color:#1e754b}.muted{color:#65736a;font-size:.91rem}table{width:100%;border-collapse:collapse}th,td{padding:9px 5px;border-bottom:1px solid #e7ede8;text-align:left}td:last-child,th:last-child{text-align:right}.hidden{display:none}.notice{background:#fff5df;padding:12px;border-radius:10px;color:#79531b}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1}.success{color:#187445;font-weight:bold}@media(max-width:480px){.card{padding:16px}.products{grid-template-columns:1fr 1fr}.product{padding:10px}}</style></head><body><main class="wrap"><header><h1>⛺ 營區早餐團購</h1><div>10/25（日）、10/26（一）｜早上 8 點前送達營區</div><p style="margin-bottom:0">取餐地點：小幫手帳篷門口（位置待公告）</p></header><section class="card"><h2>① 訂購人資訊</h2><label>帳篷／團露編號 *</label><input id="camp" placeholder="例如 A03"><label>訂購姓名 *</label><input id="name" placeholder="請填姓名"><label>聯絡電話 *</label><input id="phone" type="tel" placeholder="09xxxxxxxx"><label>取餐日期 *</label><select id="date"><option value="2026-10-25">2026/10/25（日）</option><option value="2026-10-26">2026/10/26（一）</option></select><p class="muted">兩天都要訂餐，請分別提交兩筆訂單。</p></section><section class="card"><h2>② 選擇早餐</h2><div id="foods" class="products"></div></section><section class="card"><h2>③ 選擇飲料</h2><div id="drinks" class="products"></div><label>備註</label><textarea id="notes" placeholder="特殊需求（須由小幫手確認）"></textarea></section><section class="card"><h2>④ 訂購明細與統計</h2><div id="details" class="muted">尚未選擇品項</div><p>總數量：<strong id="count">0</strong>　總金額：<span class="total" id="total">$0</span></p><div class="notice" id="mode">示範模式：訂單只保存在這台裝置的瀏覽器中，尚未連接共用雲端資料庫。不可直接用於多人正式收單。</div><button class="primary" onclick="submitOrder()">確認並提交訂單</button><button class="primary secondary" onclick="copySummary()">📋 複製訂購明細</button><p id="message" aria-live="polite"></p></section><section class="card"><h2>⑤ 訂單查詢（本裝置）</h2><p class="muted">此處只顯示本裝置建立的訂單，非全營區共用資料。</p><div id="orders"></div><div class="actions"><button class="primary secondary" onclick="exportCsv()">匯出本裝置訂單 CSV</button><button class="primary secondary" onclick="showStats()">查看本裝置備料統計</button></div><div id="stats"></div></section></main><script>
const items=[{id:'f1',name:'卡拉雞腿排堡',price:85,type:'food'},{id:'f2',name:'香煎嫩雞堡',price:80,type:'food'},{id:'f3',name:'起司牛肉堡',price:95,type:'food'},{id:'d1',name:'紅茶／奶茶',price:25,type:'drink'},{id:'d2',name:'豆漿',price:30,type:'drink'},{id:'d3',name:'鮮奶茶',price:40,type:'drink'}];let quantities=Object.fromEntries(items.map(i=>[i.id,0]));const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){for(const type of ['food','drink'])$(type==='food'?'foods':'drinks').innerHTML=items.filter(i=>i.type===type).map(i=>`<div class="product"><b>${i.name}</b><span class="price">$${i.price}</span><div class="qty"><button aria-label="減少${i.name}" onclick="change('${i.id}',-1)">−</button><span>${quantities[i.id]}</span><button aria-label="增加${i.name}" onclick="change('${i.id}',1)">＋</button></div></div>`).join('');const chosen=items.filter(i=>quantities[i.id]>0);$('details').innerHTML=chosen.length?`<table><tr><th>品項</th><th>小計</th></tr>${chosen.map(i=>`<tr><td>${i.name} × ${quantities[i.id]}</td><td>$${i.price*quantities[i.id]}</td></tr>`).join('')}</table>`:'尚未選擇品項';$('count').textContent=chosen.reduce((a,i)=>a+quantities[i.id],0);$('total').textContent='$'+chosen.reduce((a,i)=>a+i.price*quantities[i.id],0)}function change(id,d){quantities[id]=Math.max(0,Math.min(99,quantities[id]+d));render()}function getOrders(){try{return JSON.parse(localStorage.getItem('breakfast_orders_v1')||'[]')}catch{return []}}function save(o){localStorage.setItem('breakfast_orders_v1',JSON.stringify(o))}function summary(){return `日期：${$('date').value}\n帳篷：${$('camp').value}\n姓名：${$('name').value}\n電話：${$('phone').value}\n`+items.filter(i=>quantities[i.id]).map(i=>`${i.name} × ${quantities[i.id]} = $${i.price*quantities[i.id]}`).join('\n')+`\n合計：${$('total').textContent}\n備註：${$('notes').value}`};async function copySummary(){try{await navigator.clipboard.writeText(summary());$('message').textContent='已複製訂購明細'}catch{$('message').textContent='複製失敗，請手動選取明細'}}function submitOrder(){const camp=$('camp').value.trim(),name=$('name').value.trim(),phone=$('phone').value.trim();if(!camp||!name||!/^09\d{8}$/.test(phone)){alert('請填寫帳篷編號、姓名及有效的台灣手機號碼');return}if(!items.some(i=>quantities[i.id])){alert('請至少選擇一項餐點或飲料');return}if(!confirm('確定將訂單儲存在這台裝置？這不會傳送給主辦方。\n\n'+summary()))return;const o=getOrders();const order={id:'B'+Date.now(),camp,name,phone,date:$('date').value,notes:$('notes').value,quantities:{...quantities},created:new Date().toISOString()};try{o.push(order);save(o)}catch{alert('本機儲存失敗，請改用複製訂購明細');return}$('message').innerHTML=`<span class="success">已儲存在本裝置，訂單編號：${order.id}。尚未送達主辦方！</span>`;quantities=Object.fromEntries(items.map(i=>[i.id,0]));render();renderOrders()}function renderOrders(){const o=getOrders();$('orders').innerHTML=o.length?`<table><tr><th>日期／姓名</th><th>金額</th></tr>${o.map(x=>`<tr><td>${esc(x.date)}<br>${esc(x.name)} (${esc(x.camp)})</td><td>$${items.reduce((a,i)=>a+i.price*(x.quantities[i.id]||0),0)}</td></tr>`).join('')}</table>`:'尚無本機訂單'}function showStats(){const o=getOrders();let html='<h3>本機備料統計</h3>';for(const d of ['2026-10-25','2026-10-26']){const subset=o.filter(x=>x.date===d);html+=`<h4>${d}（${subset.length} 筆）</h4><table>`+items.map(i=>`<tr><td>${i.name}</td><td>${subset.reduce((a,x)=>a+(x.quantities[i.id]||0),0)} 份</td></tr>`).join('')+`<tr><th>總金額</th><th>$${subset.reduce((a,x)=>a+items.reduce((b,i)=>b+i.price*(x.quantities[i.id]||0),0),0)}</th></tr></table>`}$('stats').innerHTML=html}function exportCsv(){const rows=[['訂單編號','建立時間','取餐日期','帳篷','姓名','電話',...items.map(i=>i.name),'金額','備註']];for(const x of getOrders())rows.push([x.id,x.created,x.date,x.camp,x.name,x.phone,...items.map(i=>x.quantities[i.id]||0),items.reduce((a,i)=>a+i.price*(x.quantities[i.id]||0),0),x.notes]);const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='早餐訂單_本機.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();renderOrders();
</script></body></html>
