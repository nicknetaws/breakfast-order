<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的早餐訂單</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#263b31;background:#f3f7f2}*{box-sizing:border-box}body{margin:0}.wrap{max-width:750px;margin:auto;padding:16px 14px 60px}header{background:#267651;color:white;padding:22px;border-radius:16px}.card{background:white;border-radius:15px;padding:20px;margin-top:15px;box-shadow:0 3px 16px #163e2710}label{display:block;font-weight:650;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;font:inherit;border:1px solid #cad7cf;border-radius:8px}button{background:#267651;color:white;border:0;border-radius:9px;padding:12px 15px;font:inherit;cursor:pointer;margin:8px 8px 0 0}button:disabled{opacity:.5}.danger{background:#aa3025}.muted{color:#63736b;font-size:.9rem}.error{color:#aa3025;white-space:pre-wrap}.success{color:#187046}.hidden{display:none}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #e4eae5}.counter{display:flex;gap:12px;align-items:center}.counter button{margin:0;padding:5px 13px;background:#e8f3eb;color:#1b6741}.counter output{min-width:20px;text-align:center}.line{padding:8px 0;border-bottom:1px solid #e4eae5}.history{border-left:3px solid #c6dfce;padding:5px 0 5px 14px;margin:12px 0}.code{font-family:monospace;overflow-wrap:anywhere}a{color:#187046}</style></head><body><main class="wrap"><header><h1>🔎 我的早餐訂單</h1><div>查詢、修改、取消及查看完整變更歷程</div></header><section class="card"><a href="index.html">← 返回點餐頁面</a><p class="muted">請輸入下單成功時取得的專屬查詢碼。查詢碼等同訂單存取憑證，請勿轉傳。</p><label for="code">專屬查詢碼（32 位英數）</label><input id="code" class="code" maxlength="32" autocomplete="off" placeholder="貼上查詢碼"><button id="find">查詢訂單</button><p id="message" role="status"></p></section><section id="result" class="hidden"><section class="card"><h2>訂單資料</h2><p id="state"></p><div id="summary"></div><p id="deadline" class="muted"></p></section><section id="editbox" class="card hidden"><h2>修改訂單</h2><label>訂購姓名或 LINE 名稱</label><input id="name" maxlength="50"><label>帳篷／團露編號</label><select id="camp"><option value="">請選擇團露編號</option><option value="A01">A01</option><option value="A02">A02</option><option value="A03">A03</option><option value="A04">A04</option><option value="A05">A05</option><option value="A06">A06</option><option value="A07">A07</option><option value="A08">A08</option><option value="A09">A09</option><option value="A10">A10</option><option value="A11">A11</option><option value="A12">A12</option><option value="A13">A13</option><option value="A14">A14</option><option value="A15">A15</option><option value="A16">A16</option><option value="A17">A17</option><option value="A18">A18</option></select><label>電話（選填）</label><input id="phone" maxlength="10" inputmode="tel"><label>取餐日期</label><select id="date"><option value="2026-10-25">2026/10/25</option><option value="2026-10-26">2026/10/26</option></select><h3>餐點及飲料</h3><div id="menu"></div><label>備註</label><textarea id="note" maxlength="300"></textarea><p>修改後金額：<strong id="total">$0</strong></p><button id="save">儲存修改</button><button id="cancel" class="danger">取消整張訂單</button></section><section class="card"><h2>訂單歷程</h2><div id="history"></div></section></section></main><script>
'use strict';const URL='https://cffzosqyyfmzyhpcqkvp.supabase.co',KEY='sb_publishable_agzradDkZ1L2Badzr2ancQ_miayxkid';const menu=[['卡拉雞腿排堡',85],['香煎嫩雞堡',80],['起司牛肉堡',95],['紅茶',25],['奶茶',25],['豆漿',30],['鮮奶茶',40]];const $=id=>document.getElementById(id);let data=null,busy=false;const q=menu.map(()=>0);const line=(parent,text,cls='line')=>{const el=document.createElement('div');el.className=cls;el.textContent=text;parent.append(el)};function setMessage(msg,error=false){$('message').className=error?'error':'success';$('message').textContent=msg}async function rpc(fn,payload){const r=await fetch(URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify(payload)});const obj=await r.json();if(!r.ok)throw Error(obj.message||'操作失敗');return obj}function calc(){let total=0,count=0;q.forEach((v,i)=>{total+=v*menu[i][1];count+=v});$('total').textContent='$'+total;return {total,count,items:menu.flatMap((m,i)=>q[i]?[{name:m[0],qty:q[i]}]:[])}}function setCampSelection(select,value){select.querySelectorAll('option[data-legacy]').forEach(x=>x.remove());if(value&&!Array.from(select.options).some(x=>x.value===value)){const opt=document.createElement('option');opt.value=value;opt.textContent=value+'（既有編號）';opt.dataset.legacy='true';select.append(opt)}select.value=value||''}function render(){const o=data.order;$('result').classList.remove('hidden');$('state').textContent=o.status==='cancelled'?'狀態：已取消':'狀態：已確認';$('summary').replaceChildren();line($('summary'),'取餐日期：'+o.pickup_date);line($('summary'),'訂購姓名／LINE：'+o.customer_name);line($('summary'),'帳篷編號：'+o.camp_code);line($('summary'),'電話：'+(o.phone||'未填'));for(const it of o.items)line($('summary'),it.name+' × '+it.qty);line($('summary'),'合計：$'+o.total_amount);line($('summary'),'備註：'+(o.note||'無'));$('deadline').textContent='訂購、修改及取消統一截止：2026/10/18（日）晚上 20:00（台灣時間）；10/19 將整理名單交由早餐店備料。';$('editbox').classList.toggle('hidden',!data.can_edit);$('name').value=o.customer_name;setCampSelection($('camp'),o.camp_code);$('phone').value=o.phone||'';$('date').value=o.pickup_date;$('note').value=o.note||'';q.fill(0);for(const it of o.items){const i=menu.findIndex(m=>m[0]===it.name);if(i>=0)q[i]=it.qty}calc();$('history').replaceChildren();for(const h of data.history){const snap=h.snapshot;const act={created:'建立訂單',updated:'修改訂單',cancelled:'取消訂單'}[h.action]||h.action;const d=new Date(h.changed_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});line($('history'),d+'｜'+act+'｜'+snap.pickup_date+'｜'+snap.items.map(i=>i.name+' × '+i.qty).join('、')+'｜$'+snap.total_amount+'｜'+snap.status,'history')}if(!data.history.length)line($('history'),'尚無歷程（舊訂單可能沒有紀錄）')}
menu.forEach((m,i)=>{const row=document.createElement('div');row.className='item';const name=document.createElement('span');name.textContent=m[0]+' $'+m[1];const ctr=document.createElement('div');ctr.className='counter';const minus=document.createElement('button');minus.type='button';minus.textContent='−';const out=document.createElement('output');const plus=document.createElement('button');plus.type='button';plus.textContent='＋';minus.onclick=()=>{q[i]=Math.max(0,q[i]-1);out.textContent=q[i];calc()};plus.onclick=()=>{q[i]=Math.min(20,q[i]+1);out.textContent=q[i];calc()};ctr.append(minus,out,plus);row.append(name,ctr);$('menu').append(row);out.id='quantity'+i});function syncCounters(){q.forEach((n,i)=>$('quantity'+i).textContent=n)}const originalRender=render;render=()=>{originalRender();syncCounters()};
async function load(){const code=$('code').value.trim().toLowerCase();if(!/^[a-f0-9]{32}$/.test(code)){setMessage('請輸入完整的 32 位查詢碼',true);return}if(busy)return;busy=true;$('find').disabled=true;setMessage('查詢中…');try{data=await rpc('breakfast_find_order',{p_code:code});render();setMessage('查詢成功')}catch(e){$('result').classList.add('hidden');setMessage(e.message,true)}finally{busy=false;$('find').disabled=false}}$('find').onclick=load;
$('save').onclick=async()=>{if(!data?.can_edit||busy)return;const c=calc();if(!c.count||c.count>50){setMessage('總份數需介於 1 至 50',true);return}if(!$('name').value.trim()||!$('camp').value.trim()){setMessage('請填寫訂購名稱與帳篷編號',true);return}if($('phone').value.trim()&&!/^09\d{8}$/.test($('phone').value.trim())){setMessage('電話格式不正確',true);return}if(!confirm('確定儲存修改？新的金額為 $'+c.total))return;busy=true;$('save').disabled=true;try{data=await rpc('breakfast_change_order',{p_code:$('code').value.trim().toLowerCase(),p_action:'update',p_name:$('name').value.trim(),p_camp:$('camp').value.trim(),p_phone:$('phone').value.trim(),p_date:$('date').value,p_items:c.items,p_note:$('note').value.trim()});render();setMessage('訂單已更新，歷程已保存')}catch(e){setMessage(e.message,true)}finally{busy=false;$('save').disabled=false}};
$('cancel').onclick=async()=>{if(!data?.can_edit||busy||!confirm('確定取消整張訂單？取消後無法自行恢復。'))return;busy=true;$('cancel').disabled=true;try{data=await rpc('breakfast_change_order',{p_code:$('code').value.trim().toLowerCase(),p_action:'cancel'});render();setMessage('訂單已取消，歷程已保存')}catch(e){setMessage(e.message,true)}finally{busy=false;$('cancel').disabled=false}};
</script></body></html>
